<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>假人部位像素编辑器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 0;
    background: #14161a; color: #d8dce3;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    width: 220px;
    background: #1d2027;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    border-right: 1px solid #2a2e37;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 13px;
    margin: 0;
    color: #fff;
    font-weight: 600;
  }
  .sidebar .section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sidebar button {
    padding: 6px 10px;
    background: #2a2e37;
    color: #d8dce3;
    border: 1px solid #3a3f4a;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    text-align: left;
  }
  .sidebar button:hover { background: #353a45; }
  .sidebar button.active {
    background: #2f6fed;
    border-color: #2f6fed;
    color: #fff;
    font-weight: bold;
  }

  .part-btn {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .part-btn .swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid #444;
    flex-shrink: 0;
  }

  .brush-row {
    display: flex;
    gap: 4px;
  }
  .brush-row button {
    flex: 1;
    text-align: center;
    padding: 6px 0;
  }
  .brush-row button.active {
    background: #2f6fed;
    border-color: #2f6fed;
    color: #fff;
  }

  .info {
    font-size: 11px;
    color: #9aa3b2;
    line-height: 1.7;
    font-family: ui-monospace, Consolas, monospace;
    padding: 8px;
    background: #14161a;
    border-radius: 5px;
    word-break: break-all;
  }

  .main {
    flex: 1;
    position: relative;
    background: #0a0c10;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    padding: 8px 12px;
    background: #1d2027;
    border-bottom: 1px solid #2a2e37;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar label {
    padding: 5px 10px;
    background: #2a2e37;
    color: #d8dce3;
    border: 1px solid #3a3f4a;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  .toolbar button:hover, .toolbar label:hover { background: #353a45; }
  .toolbar .zoom-val {
    font-family: ui-monospace, Consolas, monospace;
    min-width: 50px;
    color: #4caf50;
  }

  .canvas-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: crosshair;
  }
  canvas {
    position: absolute;
    left: 0;
    top: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .legend-bar {
    padding: 6px 12px;
    background: #1d2027;
    border-top: 1px solid #2a2e37;
    font-size: 11px;
    color: #9aa3b2;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-bar span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .legend-bar .swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 1px solid #444;
  }

  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(47, 111, 237, 0.25);
    border: 4px dashed #2f6fed;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    font-weight: bold;
    pointer-events: none;
  }
  .drop-overlay.active { display: flex; }

  .welcome {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    pointer-events: none;
    z-index: 100;
  }
  .welcome.hidden { display: none; }
  .welcome .box {
    background: #1d2027;
    border: 2px dashed #3a3f4a;
    border-radius: 12px;
    padding: 40px 60px;
    text-align: center;
    color: #9aa3b2;
    font-size: 14px;
    line-height: 2;
    max-width: 500px;
  }
  .welcome .box b { color: #4caf50; }
  .welcome .box .hint {
    font-size: 12px;
    color: #5a616e;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <h2>📁 文件</h2>
  <div class="section">
    <button onclick="document.getElementById('gridInput').click()">
      📄 加载 _part_grid.txt
    </button>
    <input type="file" id="gridInput" accept=".txt" style="display:none">
    <button onclick="document.getElementById('imgInput').click()">
      🖼 加载 假人原图
    </button>
    <input type="file" id="imgInput" accept="image/*" style="display:none">
    <button onclick="exportGrid()" style="background:#2f6fed; border-color:#2f6fed; color:#fff;">
      💾 导出 _part_grid_fixed.txt
    </button>
  </div>

  <h2>🎨 部位</h2>
  <div class="section" id="partButtons"></div>

  <h2>🖌 笔刷大小</h2>
  <div class="section brush-row" id="brushRow">
    <button data-size="1" class="active">1×1</button>
    <button data-size="3">3×3</button>
    <button data-size="5">5×5</button>
  </div>

  <h2>✨ 边缘平滑</h2>
  <div class="section">
    <div style="font-size:11px; color:#9aa3b2;">强度</div>
    <input type="range" id="smoothStrength" min="1" max="5" value="1" style="width:100%;">
    <div style="font-size:11px; color:#4caf50; text-align:right;" id="smoothVal">1</div>
    <button onclick="smoothEdges()" style="background:#2f6fed; border-color:#2f6fed; color:#fff;">
      ✨ 平滑边缘（直接修改数据）
    </button>
    <div style="font-size:11px; color:#9aa3b2; line-height:1.5;">
      自动重分配边界像素，让分界线更整齐；不扩张，可撤销。
    </div>
  </div>

  <h2>📊 信息</h2>
  <div class="info" id="info">未加载</div>

  <h2>❓ 操作</h2>
  <div class="info">
    · 左键：涂抹<br>
    · 右键：擦除（设为空）<br>
    · 滚轮：缩放<br>
    · <b>按住空格 + 左键拖动：平移</b><br>
    · 中键拖动：平移<br>
    · 只编辑左半边，右半边自动镜像<br>
    · 也可以直接拖文件到窗口
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <button id="btnZoomIn">🔍+ 放大</button>
    <button id="btnZoomOut">🔍− 缩小</button>
    <span class="zoom-val" id="zoomVal">1.0×</span>
    <button id="btnZoomReset">⟲ 复位</button>
    <span style="border-left:1px solid #3a3f4a; height:20px;"></span>
    <label><input type="checkbox" id="chkOverlay" checked> 原图叠加</label>
    <label><input type="checkbox" id="chkGrid"> 网格</label>
    <label><input type="checkbox" id="chkMirror" checked> 左右镜像</label>
    <span style="border-left:1px solid #3a3f4a; height:20px;"></span>
    <button id="btnUndo">↶ 撤销</button>
    <button id="btnRedo">↷ 重做</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mainCanvas"></canvas>

    <div class="welcome" id="welcome">
      <div class="box">
        <b>拖拽文件到窗口加载</b><br>
        · <b>_part_grid.txt</b>（必须）<br>
        · <b>靶场假人.png</b>（可选，用于叠加显示）<br>
        <div class="hint">或者点左侧按钮选择文件</div>
      </div>
    </div>
  </div>

  <div class="legend-bar" id="legendBar">
    <span>鼠标: <b id="mousePos">-</b></span>
    <span>部位: <b id="curPos">-</b></span>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay">
  📥 松开以加载文件
</div>

<script>
// ============================================================
// 常量
// ============================================================

const IMG_W = 1012;
const IMG_H = 1327;
const MIRROR_AXIS = 506;

const PARTS = [
  { idx: 0, name: '空/脱靶', color: '#2a2e37' },
  { idx: 1, name: '头部',   color: '#e53935' },
  { idx: 2, name: '胸部',   color: '#fb8c00' },
  { idx: 3, name: '腹部',   color: '#fdd835' },
  { idx: 4, name: '上臂',   color: '#43a047' },
  { idx: 5, name: '下臂',   color: '#00acc1' },
  { idx: 6, name: '大腿',   color: '#1e88e5' },
  { idx: 7, name: '小腿',   color: '#8e24aa' },
];

// ============================================================
// 状态
// ============================================================

let grid = null;
let baseImageData = null;
let hasImage = false;

let currentPart = 1;
let brushSize = 1;

let zoom = 1.0;
let panX = 0;
let panY = 0;

let isPainting = false;
let isPanning = false;
let isSpaceDown = false;
let lastMouse = { x: 0, y: 0 };

let undoStack = [];
let redoStack = [];
const MAX_UNDO = 50;

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const canvasWrap = document.getElementById('canvasWrap');
const welcomeEl = document.getElementById('welcome');

// ============================================================
// 初始化 UI
// ============================================================

function initPartButtons() {
  const container = document.getElementById('partButtons');
  container.innerHTML = '';
  for (const p of PARTS) {
    const btn = document.createElement('button');
    btn.className = 'part-btn';
    btn.dataset.idx = p.idx;
    btn.innerHTML = `<i class="swatch" style="background:${p.color}"></i>${p.name}`;
    if (p.idx === currentPart) btn.classList.add('active');
    btn.addEventListener('click', () => {
      currentPart = p.idx;
      document.querySelectorAll('#partButtons button').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.idx) === currentPart);
      });
    });
    container.appendChild(btn);
  }
}
initPartButtons();

document.querySelectorAll('#brushRow button').forEach(btn => {
  btn.addEventListener('click', () => {
    brushSize = parseInt(btn.dataset.size);
    document.querySelectorAll('#brushRow button').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
  });
});

function initLegend() {
  const bar = document.getElementById('legendBar');
  for (const p of PARTS) {
    const span = document.createElement('span');
    span.innerHTML = `<i class="swatch" style="background:${p.color}"></i>${p.name}`;
    bar.appendChild(span);
  }
}
initLegend();

// ============================================================
// 边界重分配（直接修改数据）
// ------------------------------------------------------------
// 思路：
//   遍历所有像素，对每一个像素（包括 0）：
//     · 看它 3×3 邻域里各种部位出现的次数
//     · 若自己是 0：
//         - 只有 3×3 里非零 >= 6（被强烈包围）才允许变成部位
//         - 否则保持 0（不扩张）
//     · 若自己非 0：
//         - 取 3×3 里的众数
//         - 众数是 0 且非零总数很少（孤立毛刺）→ 削掉变 0
//         - 否则改为众数（修平凸起 / 填凹口）
//   迭代 strength 次，逐步收敛。
// ============================================================

function smoothEdgesData(src, iterations = 1) {
  const W = IMG_W, H = IMG_H;
  let g = new Uint8Array(src);

  for (let it = 0; it < iterations; it++) {
    const next = new Uint8Array(g); // 边缘保持原值，避免越界

    for (let y = 1; y < H - 1; y++) {
      const base = y * W;
      for (let x = 1; x < W - 1; x++) {
        const idx = base + x;
        const self = g[idx];

        // 统计 3×3 邻域
        const counts = {};
        let nonZero = 0;
        let totalNonZeroAround = 0;
        for (let dy = -1; dy <= 1; dy++) {
          const b2 = idx + dy * W;
          for (let dx = -1; dx <= 1; dx++) {
            const v = g[b2 + dx];
            if (v !== 0) {
              counts[v] = (counts[v] || 0) + 1;
              nonZero++;
            }
          }
        }
        // nonZero 含自己，去掉自己
        if (self !== 0) nonZero -= 1;
        totalNonZeroAround = nonZero;

        if (self === 0) {
          // --- 自己是背景 ---
          // 只有周围非零 >= 6 才允许被填（被强烈包围）
          if (totalNonZeroAround >= 6) {
            let best = 0, bestC = 0;
            for (const k in counts) {
              if (counts[k] > bestC) { bestC = counts[k]; best = +k; }
            }
            if (best !== 0) next[idx] = best;
          }
          // 否则保持 0（不外扩）
        } else {
          // --- 自己是部位 ---
          // 取 3×3（含自己）众数
          const countsSelf = Object.assign({}, counts);
          countsSelf[self] = (countsSelf[self] || 0) + 1;

          let best = 0, bestC = -1;
          for (const k in countsSelf) {
            if (countsSelf[k] > bestC) { bestC = countsSelf[k]; best = +k; }
          }

          if (best === 0) {
            // 众数是背景，且周围非零很少 → 视为孤立毛刺，削掉
            if (totalNonZeroAround <= 1) {
              next[idx] = 0;
            } else {
              next[idx] = self; // 保持
            }
          } else {
            // 改为众数：修平凸起、填凹口、纠正碎边
            next[idx] = best;
          }
        }
      }
    }
    g = next;
  }
  return g;
}

function smoothEdges() {
  if (!grid) { alert('还没加载 grid'); return; }
  const strength = parseInt(document.getElementById('smoothStrength').value, 10) || 1;
  pushUndo();
  grid = smoothEdgesData(grid, strength);
  render();
  updateInfo(`✅ 已平滑边缘（强度 ${strength}），可 Ctrl+Z 撤销`);
}

document.getElementById('smoothStrength').addEventListener('input', (e) => {
  document.getElementById('smoothVal').textContent = e.target.value;
});

// ============================================================
// 加载 grid
// ============================================================

async function loadGridFromText(text, filename) {
  const lines = text.split('\n').filter(l => l.trim().length > 0);

  if (lines.length !== IMG_H) {
    alert(`行数不对：期望 ${IMG_H}，实际 ${lines.length}\n（文件: ${filename}）`);
    return false;
  }

  const newGrid = new Uint8Array(IMG_W * IMG_H);

  for (let y = 0; y < IMG_H; y++) {
    const parts = lines[y].trim().split(/\s+/);
    if (parts.length !== IMG_W) {
      alert(`第 ${y} 行列数不对：期望 ${IMG_W}，实际 ${parts.length}`);
      return false;
    }
    for (let x = 0; x < IMG_W; x++) {
      newGrid[y * IMG_W + x] = parseInt(parts[x], 10) || 0;
    }
  }

  grid = newGrid;
  undoStack = [];
  redoStack = [];
  updateInfo(`✅ 已加载 grid: ${filename}<br>${IMG_W} × ${IMG_H}`);
  welcomeEl.classList.add('hidden');
  resizeCanvas();
  fitToWindow();
  render();
  return true;
}

function loadImageFromBlob(blob, filename) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = IMG_W;
      tmpCanvas.height = IMG_H;
      const tmpCtx = tmpCanvas.getContext('2d');
      tmpCtx.drawImage(img, 0, 0, IMG_W, IMG_H);
      baseImageData = tmpCtx.getImageData(0, 0, IMG_W, IMG_H);
      hasImage = true;
      URL.revokeObjectURL(url);
      updateInfo(`✅ 已加载原图: ${filename}<br>${img.width} × ${img.height}`);
      render();
      resolve(true);
    };
    img.onerror = () => {
      alert(`图片加载失败: ${filename}`);
      URL.revokeObjectURL(url);
      resolve(false);
    };
    img.src = url;
  });
}

document.getElementById('gridInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  await loadGridFromText(text, file.name);
  e.target.value = '';
});

document.getElementById('imgInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  await loadImageFromBlob(file, file.name);
  e.target.value = '';
});

// ============================================================
// 拖拽加载
// ============================================================

let dragCounter = 0;
const dropOverlay = document.getElementById('dropOverlay');

document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('active');
});

document.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('active');
  }
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');

  const files = Array.from(e.dataTransfer.files);
  for (const file of files) {
    const lower = file.name.toLowerCase();
    if (lower.endsWith('.txt')) {
      const text = await file.text();
      await loadGridFromText(text, file.name);
    } else if (lower.match(/\.(png|jpg|jpeg|webp|gif)$/)) {
      await loadImageFromBlob(file, file.name);
    }
  }
});

// ============================================================
// 画布尺寸
// ============================================================

function resizeCanvas() {
  const rect = canvasWrap.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}

window.addEventListener('resize', () => {
  resizeCanvas();
  render();
});

// ============================================================
// 视图
// ============================================================

function fitToWindow() {
  const rect = canvasWrap.getBoundingClientRect();
  const zx = rect.width / IMG_W;
  const zy = rect.height / IMG_H;
  zoom = Math.min(zx, zy) * 0.95;
  panX = (rect.width - IMG_W * zoom) / 2;
  panY = (rect.height - IMG_H * zoom) / 2;
  updateZoomVal();
}

function updateZoomVal() {
  document.getElementById('zoomVal').textContent = zoom.toFixed(2) + '×';
}

function screenToImage(sx, sy) {
  return {
    x: Math.floor((sx - panX) / zoom),
    y: Math.floor((sy - panY) / zoom),
  };
}

function updateCursor() {
  if (isSpaceDown) {
    canvas.style.cursor = isPanning ? 'grabbing' : 'grab';
  } else {
    canvas.style.cursor = 'crosshair';
  }
}

// ============================================================
// 渲染（保持原样：像素硬边，不做抗锯齿）
// ============================================================

function render() {
  if (!grid) {
    ctx.fillStyle = '#0a0c10';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const showOverlay = document.getElementById('chkOverlay').checked;
  const showGrid = document.getElementById('chkGrid').checked;

  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const off = document.createElement('canvas');
  off.width = IMG_W;
  off.height = IMG_H;
  const offCtx = off.getContext('2d');
  const imgData = offCtx.createImageData(IMG_W, IMG_H);

  for (let y = 0; y < IMG_H; y++) {
    for (let x = 0; x < IMG_W; x++) {
      const pidx = grid[y * IMG_W + x];
      const i = (y * IMG_W + x) * 4;

      if (pidx === 0) {
        if (showOverlay && hasImage) {
          imgData.data[i]     = baseImageData.data[i];
          imgData.data[i + 1] = baseImageData.data[i + 1];
          imgData.data[i + 2] = baseImageData.data[i + 2];
          imgData.data[i + 3] = 255;
        } else {
          imgData.data[i]     = 14;
          imgData.data[i + 1] = 16;
          imgData.data[i + 2] = 20;
          imgData.data[i + 3] = 255;
        }
      } else {
        const part = PARTS.find(p => p.idx === pidx);
        if (part) {
          const c = hexToRgb(part.color);
          if (showOverlay && hasImage) {
            const alpha = 0.65;
            imgData.data[i]     = Math.round(baseImageData.data[i]     * (1 - alpha) + c.r * alpha);
            imgData.data[i + 1] = Math.round(baseImageData.data[i + 1] * (1 - alpha) + c.g * alpha);
            imgData.data[i + 2] = Math.round(baseImageData.data[i + 2] * (1 - alpha) + c.b * alpha);
            imgData.data[i + 3] = 255;
          } else {
            imgData.data[i]     = c.r;
            imgData.data[i + 1] = c.g;
            imgData.data[i + 2] = c.b;
            imgData.data[i + 3] = 255;
          }
        } else {
          imgData.data[i]     = 0;
          imgData.data[i + 1] = 0;
          imgData.data[i + 2] = 0;
          imgData.data[i + 3] = 255;
        }
      }
    }
  }

  offCtx.putImageData(imgData, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, IMG_W, IMG_H,
                panX, panY, IMG_W * zoom, IMG_H * zoom);

  if (showGrid && zoom >= 8) {
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const x0 = Math.max(0, Math.floor(-panX / zoom));
    const x1 = Math.min(IMG_W, Math.ceil((canvas.width - panX) / zoom));
    const y0 = Math.max(0, Math.floor(-panY / zoom));
    const y1 = Math.min(IMG_H, Math.ceil((canvas.height - panY) / zoom));
    for (let x = x0; x <= x1; x++) {
      const sx = Math.round(panX + x * zoom) + 0.5;
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, canvas.height);
    }
    for (let y = y0; y <= y1; y++) {
      const sy = Math.round(panY + y * zoom) + 0.5;
      ctx.moveTo(0, sy);
      ctx.lineTo(canvas.width, sy);
    }
    ctx.stroke();
  }

  const axisX = panX + MIRROR_AXIS * zoom;
  if (axisX >= 0 && axisX <= canvas.width) {
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(axisX, 0);
    ctx.lineTo(axisX, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.substring(0, 2), 16),
    g: parseInt(h.substring(2, 4), 16),
    b: parseInt(h.substring(4, 6), 16),
  };
}

// ============================================================
// 编辑
// ============================================================

function paintAt(ix, iy, value) {
  if (!grid) return;
  if (ix < 0 || ix >= IMG_W || iy < 0 || iy >= IMG_H) return;

  const half = Math.floor(brushSize / 2);
  const mirrorOn = document.getElementById('chkMirror').checked;

  for (let dy = -half; dy <= half; dy++) {
    for (let dx = -half; dx <= half; dx++) {
      let px = ix + dx;
      const py = iy + dy;
      if (px < 0 || px >= IMG_W || py < 0 || py >= IMG_H) continue;

      if (px > MIRROR_AXIS) {
        px = 2 * MIRROR_AXIS - px;
        if (px < 0 || px >= IMG_W) continue;
      }

      grid[py * IMG_W + px] = value;

      if (mirrorOn && px <= MIRROR_AXIS) {
        const mx = 2 * MIRROR_AXIS - px;
        if (mx >= 0 && mx < IMG_W) {
          grid[py * IMG_W + mx] = value;
        }
      }
    }
  }
}

canvas.addEventListener('mousedown', (e) => {
  if (!grid) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const img = screenToImage(sx, sy);

  if (isSpaceDown && e.button === 0) {
    isPanning = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    updateCursor();
    e.preventDefault();
    return;
  }

  if (e.button === 0) {
    isPainting = true;
    pushUndo();
    paintAt(img.x, img.y, currentPart);
    render();
  } else if (e.button === 2) {
    isPainting = true;
    pushUndo();
    paintAt(img.x, img.y, 0);
    render();
  } else if (e.button === 1) {
    isPanning = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    e.preventDefault();
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const img = screenToImage(sx, sy);

  if (grid && img.x >= 0 && img.x < IMG_W && img.y >= 0 && img.y < IMG_H) {
    document.getElementById('mousePos').textContent = `${img.x}, ${img.y}`;
    const pidx = grid[img.y * IMG_W + img.x];
    const part = PARTS.find(p => p.idx === pidx);
    document.getElementById('curPos').textContent = part ? part.name : '?';
  }

  if (isPainting) {
    paintAt(img.x, img.y, e.buttons === 2 ? 0 : currentPart);
    render();
  } else if (isPanning) {
    panX += e.clientX - lastMouse.x;
    panY += e.clientY - lastMouse.y;
    lastMouse = { x: e.clientX, y: e.clientY };
    render();
  }
});

canvas.addEventListener('mouseup', () => {
  isPainting = false;
  isPanning = false;
  updateCursor();
});

canvas.addEventListener('mouseleave', () => {
  isPainting = false;
  isPanning = false;
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  if (!grid) return;
  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const imgX = (mx - panX) / zoom;
  const imgY = (my - panY) / zoom;

  const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  zoom = Math.max(0.1, Math.min(40, zoom * factor));

  panX = mx - imgX * zoom;
  panY = my - imgY * zoom;

  updateZoomVal();
  render();
}, { passive: false });

// ============================================================
// 缩放按钮
// ============================================================

document.getElementById('btnZoomIn').addEventListener('click', () => {
  zoom = Math.min(40, zoom * 1.3);
  updateZoomVal();
  render();
});

document.getElementById('btnZoomOut').addEventListener('click', () => {
  zoom = Math.max(0.1, zoom / 1.3);
  updateZoomVal();
  render();
});

document.getElementById('btnZoomReset').addEventListener('click', () => {
  fitToWindow();
  render();
});

// ============================================================
// 撤销/重做
// ============================================================

function pushUndo() {
  if (!grid) return;
  undoStack.push(new Uint8Array(grid));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

document.getElementById('btnUndo').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  redoStack.push(new Uint8Array(grid));
  grid = undoStack.pop();
  render();
});

document.getElementById('btnRedo').addEventListener('click', () => {
  if (redoStack.length === 0) return;
  undoStack.push(new Uint8Array(grid));
  grid = redoStack.pop();
  render();
});

// ============================================================
// 键盘
// ============================================================

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    if (!isSpaceDown) {
      isSpaceDown = true;
      updateCursor();
    }
    if (e.target === document.body) {
      e.preventDefault();
    }
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btnUndo').click();
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
    e.preventDefault();
    document.getElementById('btnRedo').click();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    isSpaceDown = false;
    updateCursor();
  }
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
  }
});

// ============================================================
// 导出
// ============================================================

function exportGrid() {
  if (!grid) {
    alert('还没加载 grid');
    return;
  }

  const lines = [];
  for (let y = 0; y < IMG_H; y++) {
    const row = [];
    for (let x = 0; x < IMG_W; x++) {
      row.push(grid[y * IMG_W + x]);
    }
    lines.push(row.join(' '));
  }

  const text = lines.join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '_part_grid_fixed.txt';
  a.click();
  URL.revokeObjectURL(url);

  updateInfo('✅ 已导出 _part_grid_fixed.txt');
}

// ============================================================
// 开关 / 信息
// ============================================================

document.getElementById('chkOverlay').addEventListener('change', render);
document.getElementById('chkGrid').addEventListener('change', render);

function updateInfo(html) {
  document.getElementById('info').innerHTML = html;
}

// ============================================================
// 启动
// ============================================================

resizeCanvas();
render();
</script>
