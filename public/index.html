<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲 TTK计算器</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./assets/libs/chart.umd.min.js"></script>
  <script src="./assets/libs/chartjs-plugin-datalabels.min.js"></script>
</head>

<body>
  <div class="title-container">
    <!-- <img src="./assets/title.png" alt="TTK计算器标题" class="title-image"> -->
    <h2>TTK计算器</h2>
  </div>
  
  <div class="version-info">
    <span class="update-date">
      <span class="date-label">更新日期:</span>
      <span class="date-value">2026/8/8</span>
    </span>
    <span class="version-log">
      <a href="./assets/Version.txt" target="_blank" title="查看更新日志">
        <span class="version-label">版本日志</span>
      </a>
    </span>
    <span class="author">
      <a href="https://space.bilibili.com/128602631?spm_id_from=333.1007.0.0" target="_blank" title="访问UP主B站页面">
        <img src="./assets/bili.png" alt="B站" class="author-icon" width="16" height="16">
        <span class="author-name">殘雲碎夢</span>
      </a>
    </span>
  </div>
  
  <div class="control-group">
    <label for="bulletLevel">子弹等级</label>
    <select id="bulletLevel">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
    </select>
    <label for="healthValue">生命值</label>
    <input type="number" id="healthValue" value="100" min="1" max="800">
  </div>
  
  <div class="control-group">
    <label for="armorLevel">护甲等级</label>
    <select id="armorLevel">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
    <label for="armorValue">护甲值</label>
    <input type="number" id="armorValue" value="80" min="0" max="200">
  </div>

  <div class="control-group">
    <label for="helmetLevel">头盔等级</label>
    <select id="helmetLevel">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
    <label for="helmetValue">头盔值</label>
    <input type="number" id="helmetValue" value="35" min="0" max="100">
  </div>
  
  <div class="control-group" id="distance-group">
    <label for="distance">交战距离 (m)</label>
    <input type="number" id="distance" value="30" min="0">
  </div>
   
  <fieldset class="control-group">
    <legend>击中部位概率</legend>
    <div class="prob-item">
      <label>头部:</label><input type="number" id="pHead" value="0.18" step="0.01" min="0" max="1">
      <label>胸部:</label><input type="number" id="pChest" value="0.3" step="0.01" min="0" max="1">
      <label>腹部:</label><input type="number" id="pStomach" value="0.22" step="0.01" min="0" max="1">
      <label>四肢:</label><input type="number" id="pLimbs" value="0.3" step="0.01" min="0" max="1">
    </div>
  </fieldset>
  
  <div class="control-group">
    <label for="triggerDelayEnable">扳机延迟</label>
    <input type="checkbox" id="triggerDelayEnable" checked>
    <label for="globalBarrelType">枪管类型:</label>
    <select id="globalBarrelType">
      <option value="none">无</option>
      <option value="longest" selected>射程最长枪管</option>
    </select>
    <label for="hitRate">命中率:</label>
    <input type="number" id="hitRate" value="0.85" min="0" max="1" step="0.01">
  </div>

  <div class="buttons-container">
    <button id="calcBtn">生成TTK排行榜</button>
    <button id="distChartBtn">生成TTK折线图</button>
  </div>
  
  <div class="canvas-container">
    <canvas id="ttkChart" width="800" height="400"></canvas>
  </div>
  
  <div class="canvas-container">
    <canvas id="distanceChart" width="800" height="400"></canvas>
  </div>

  <!-- 武器数据编辑提示 -->
  <div class="data-edit-tip">
    <strong>💡 提示：</strong>
    <span style="color: #1565c0;">左侧"原始"列可编辑，右侧"当前"列为计算值（只读）</span>
    <span class="tip-sub">
      📌 修改原始数据后，当前列会根据枪管/枪口/精校自动重新计算
    </span>
  </div>

  <!-- 表格容器 - 添加 overflow-x: auto 以支持水平滚动 -->
  <div style="overflow-x: auto; width: 100%;">
    <table id="attachmentTable">
      <thead>
        <tr>
          <th rowspan="2">武器</th>
          <th rowspan="2">类型</th>
          <th colspan="2">射速</th>
          <th colspan="2">初速</th>
          <th colspan="2">射程</th>
          <th colspan="2">基础伤害</th>
          <th colspan="2">护甲伤害</th>
          <th colspan="2">部位倍率</th>
          <th rowspan="2">部位伤害</th>
          <th rowspan="2">枪管</th>
          <th rowspan="2">枪口</th>
          <th rowspan="2">子弹类型</th>
          <th rowspan="2">命中率</th>
          <th rowspan="2">枪口初速精校</th>
          <th rowspan="2">操作</th>
        </tr>
        <tr>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
          <th class="sub-header">原始</th>
          <th class="sub-header">当前</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 新增枪械按钮区域 -->
  <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <button id="addWeaponBtn" style="background-color: #4caf50; color: #fff; padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: background-color 0.2s;">
      ➕ 新增枪械
    </button>
    <span style="font-size: 0.85rem; color: #666;">点击后在表格底部添加新行，填写数据后点击"确认添加"保存</span>
  </div>

  <!-- 数据管理提示 -->
  <div class="data-management-tip">
    <span>💾 数据自动保存在浏览器本地</span>
    <span>📤 点击"导出数据"可备份为JSON文件</span>
    <span>📥 点击"导入数据"可恢复备份</span>
    <span>🔄 点击"重置为默认"恢复原始数据</span>
  </div>

  <!-- 新增枪械按钮的JavaScript事件绑定 -->
  <script>
    // 等待DOM加载完成后绑定新增枪械按钮事件
    document.addEventListener('DOMContentLoaded', function() {
      const addWeaponBtn = document.getElementById('addWeaponBtn');
      if (addWeaponBtn) {
        addWeaponBtn.addEventListener('click', function() {
          // 找到新增行
          const addRow = document.getElementById('addWeaponRow');
          if (addRow) {
            // 如果已经存在，滚动到该行并聚焦第一个输入框
            addRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const firstInput = addRow.querySelector('input');
            if (firstInput) {
              firstInput.focus();
            }
          } else {
            // 如果不存在，重新渲染表格以显示新增行
            if (window.app && window.app.domController) {
              window.app.domController.renderAttachmentTable();
              setTimeout(function() {
                const newAddRow = document.getElementById('addWeaponRow');
                if (newAddRow) {
                  newAddRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  const firstInput = newAddRow.querySelector('input');
                  if (firstInput) {
                    firstInput.focus();
                  }
                }
              }, 100);
            }
          }
        });
      }
    });
  </script>

  <script src="./bundle.js"></script>
</body>

</html>
