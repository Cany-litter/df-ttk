<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Force TTK 计算器</title>

  <!-- 外部库 -->
  <script src="./assets/libs/chart.umd.min.js"></script>
  <script src="./assets/libs/chartjs-plugin-datalabels.min.js"></script>

  <!-- 样式 -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- ========== 头部 ========== -->
    <header class="app-header">
      <div class="header-left">
         <span>三角洲 TTK 计算器</span>
      </div>
      <div class="header-right">
        <a href="https://space.bilibili.com/128602631?spm_id_from=333.1007.0.0" target="_blank">
          <span>殘雲碎夢</span>
          <img src="./assets/bili.png" alt="B站" class="bili-icon" />
        </a>
      </div>
    </header>

    <!-- ========== 主内容 ========== -->
    <main class="app-main">
      <!-- 顶部：参数面板（水平布局） -->
      <div class="params-panel">
        <!-- 第1行：核心战斗参数 -->
        <div class="params-row">
          <!-- 子弹等级 -->
          <div class="param-group compact">
            <label for="bulletLevel">子弹等级</label>
            <select id="bulletLevel">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
            </select>
          </div>

          <!-- 护甲等级 -->
          <div class="param-group compact">
            <label for="armorLevel">护甲等级</label>
            <select id="armorLevel">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>

          <!-- 护甲值 -->
          <div class="param-group compact">
            <label for="armorValue">护甲值</label>
            <input type="number" id="armorValue" value="110" min="0" max="200" />
          </div>

          <!-- 头盔等级 -->
          <div class="param-group compact">
            <label for="helmetLevel">头盔等级</label>
            <select id="helmetLevel">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>

          <!-- 头盔值 -->
          <div class="param-group compact">
            <label for="helmetValue">头盔值</label>
            <input type="number" id="helmetValue" value="48" min="0" max="100" />
          </div>

          <!-- 生命值 -->
          <div class="param-group compact">
            <label for="healthValue">生命值</label>
            <input type="number" id="healthValue" value="100" min="1" max="200" />
          </div>
        </div>

        <!-- 第2行：命中相关参数 -->
        <div class="params-row">
          <!-- 距离 -->
          <div class="param-group compact">
            <label for="distance">距离 (m)</label>
            <input type="number" id="distance" value="30" min="0" max="300" />
          </div>

          <!-- 全局命中率 -->
          <div class="param-group compact">
            <label for="hitRate">全局命中率</label>
            <input type="text" id="hitRate" value="30:1.0,50:0.9,100:0.6" placeholder="30:1.0,50:0.9,100:0.6" />
            <span class="hint-text">格式: 距离:命中率,距离:命中率</span>
          </div>

          <!-- 扳机延迟 -->
          <div class="param-group compact checkbox-group">
            <label>
              <input type="checkbox" id="triggerDelayEnable" checked />
              扳机延迟
            </label>
          </div>

          <!-- 命中概率 -->
          <div class="hit-prob-horizontal">
            <label>命中概率</label>
            <div class="hit-prob-row">
              <span>头部</span>
              <input type="number" id="pHead" value="0.1" min="0" max="1" step="0.01" />
            </div>
            <div class="hit-prob-row">
              <span>胸部</span>
              <input type="number" id="pChest" value="0.3" min="0" max="1" step="0.01" />
            </div>
            <div class="hit-prob-row">
              <span>腹部</span>
              <input type="number" id="pStomach" value="0.3" min="0" max="1" step="0.01" />
            </div>
            <div class="hit-prob-row">
              <span>四肢</span>
              <input type="number" id="pLimbs" value="0.3" min="0" max="1" step="0.01" />
            </div>
          </div>
        </div>

        <!-- 第3行：操作按钮 -->
        <div class="params-row">
          <div class="buttons-group">
            <button id="calcBtn" class="btn-primary">📊 计算 TTK</button>
            <button id="resetDataBtn" class="btn-secondary" style="background:#ff9800;color:#fff;">🔄 重置</button>
            <button id="exportDataBtn" class="btn-secondary" style="background:#9c27b0;color:#fff;">📤 导出数据</button>
            <button id="importDataBtn" class="btn-secondary" style="background:#607d8b;color:#fff;">📥 导入数据</button>
            <!-- ⭐ 包含缓存复选框 -->
            <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#555;cursor:pointer;margin-left:4px;">
              <input type="checkbox" id="includeCacheCheckbox" checked />
              包含缓存数据
            </label>
          </div>
        </div>
      </div>

      <!-- ========== 图表区域（垂直堆叠） ========== -->
      <div class="charts-area">
        <!-- TTK 柱状图 -->
        <div class="chart-wrapper">
          <h3>TTK 对比</h3>
          <canvas id="ttkChart"></canvas>
        </div>

        <!-- 距离折线图 -->
        <div class="chart-wrapper">
          <!-- 图表头部控制栏 -->
          <div class="chart-header">
            <!-- 左侧：标题 + 显示全部 -->
            <div class="left-group">
              <h3>距离 - TTK 折线图</h3>

              <span class="divider"></span>

              <!-- 显示全部武器 -->
              <label>
                <input type="checkbox" id="showAllWeapons" checked />
                显示全部
              </label>
            </div>

            <!-- 右侧：操作按钮 -->
            <div class="right-group">
              <!-- ⭐ 高亮武器选择 -->
              <div class="highlight-selector" style="display:flex;align-items:center;gap:4px;">
                <label style="font-size:12px;color:#555;white-space:nowrap;">⭐ 高亮:</label>
                <select id="highlightWeaponSelect" style="max-width:150px;padding:2px 4px;border:1px solid #d0d0d0;border-radius:3px;font-size:11px;height:24px;">
                  <option value="">无</option>
                </select>
              </div>

              <!-- 生成折线图按钮 -->
              <button id="distChartBtn" class="btn-primary">📈 生成折线图</button>
            </div>
          </div>

          <!-- 折线图 Canvas -->
          <canvas id="distanceChart"></canvas>
        </div>
      </div>

      <!-- ========== 底部表格区域 ========== -->
      <div class="table-section">
        <!-- Tab 导航栏 -->
        <div class="table-tabs">
          <button class="tab-btn active" data-tab="price">💰 价格数据</button>
          <button class="tab-btn" data-tab="weapon">🔫 枪械数据</button>
          <button class="tab-btn" data-tab="bullet">💊 子弹数据</button>
        </div>

        <!-- Tab 内容容器 -->
        <div class="tab-content-wrapper">
          <!-- Tab 1: 价格数据（默认显示） -->
          <div id="tab-price" class="tab-content active">
            <!-- 由 PriceTable 动态渲染 -->
          </div>

          <!-- Tab 2: 枪械数据 -->
          <div id="tab-weapon" class="tab-content">
            <!-- 由 WeaponTable 动态渲染 -->
          </div>

          <!-- Tab 3: 子弹数据 -->
          <div id="tab-bullet" class="tab-content">
            <!-- 由 BulletTable 动态渲染 -->
          </div>
        </div>
      </div>
    </main>

    <!-- ========== 页脚 ========== -->
    <footer class="app-footer">
      <span>Delta Force TTK Calculator &copy; 2026</span>
      <span class="footer-separator">|</span>
      <span>数据仅供参考，以游戏内为准</span>
    </footer>
  </div>

  <!-- ========== 弹窗：枪管编辑器 ========== -->
  <div id="barrelEditorModal" class="modal" style="display:none;">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3>🔧 编辑枪管 — <span id="barrelEditorWeaponName"></span></h3>
        <button id="barrelEditorClose" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="table-scroll">
          <div id="barrelEditorContainer">
            <!-- 由 BarrelEditor 动态渲染 -->
            <div class="empty-barrel-msg">
              <p>📭 暂无枪管数据</p>
              <span class="hint">点击下方 "新增枪管" 添加</span>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="addBarrelBtn" class="btn-secondary">➕ 新增枪管</button>
          <button id="saveBarrelBtn" class="btn-primary">💾 保存</button>
          <button id="cancelBarrelBtn" class="btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 弹窗：新增枪管 ========== -->
  <div id="addBarrelModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>➕ 新增枪管</h3>
        <button id="addBarrelModalClose" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <!-- 左列 -->
          <div class="form-group">
            <label>枪管名称 *</label>
            <input type="text" id="newBarrelName" placeholder="如：长枪管" />
          </div>
          <div class="form-group">
            <label>射程倍率</label>
            <input type="number" id="newBarrelRangeMult" step="0.01" value="1.0" />
          </div>
          <div class="form-group">
            <label>射程增量</label>
            <input type="number" id="newBarrelRangeAdd" step="0.01" value="0" />
          </div>
          <div class="form-group">
            <label>初速倍率</label>
            <input type="number" id="newBarrelVelocityMult" step="0.01" value="1.0" />
          </div>
          <div class="form-group">
            <label>初速增量</label>
            <input type="number" id="newBarrelVelocityAdd" step="1" value="0" />
          </div>
          <div class="form-group">
            <label>射速倍率</label>
            <input type="number" id="newBarrelRofMult" step="0.01" value="1.0" />
          </div>
          <div class="form-group">
            <label>肉伤加成</label>
            <input type="number" id="newBarrelDamageBonus" step="0.1" value="0" />
          </div>
          <div class="form-group">
            <label>甲伤加成</label>
            <input type="number" id="newBarrelArmorDamageBonus" step="0.1" value="0" />
          </div>

          <!-- 右列 -->
          <div class="form-group">
            <label>扳机延迟 Δ</label>
            <input type="number" id="newBarrelTriggerDelayDelta" step="1" value="0" />
          </div>
          <div class="form-group">
            <label>自定义射程</label>
            <input type="text" id="newBarrelRanges" placeholder="40,70,∞,∞" />
            <span class="form-hint">用逗号分隔，∞ 表示无限</span>
          </div>
          <div class="form-group">
            <label>自定义衰减</label>
            <input type="text" id="newBarrelDecays" placeholder="1.0,0.85,0.7,0.7,0.7" />
            <span class="form-hint">5个值，对应5个射程段</span>
          </div>
          <div class="form-group">
            <label>部位倍率加成 (JSON)</label>
            <input type="text" id="newBarrelPartMultAdd" placeholder='{"head":0.1,"chest":0.05}' />
            <span class="form-hint">JSON 格式，如 {"head": 0.1}</span>
          </div>
          <div class="form-group">
            <label>开火模式</label>
            <select id="newBarrelFireMode">
              <option value="">默认</option>
              <option value="auto">全自动</option>
              <option value="burst">连发</option>
            </select>
          </div>
          <div class="form-group" id="newBarrelBurstFields" style="display:none;">
            <label>连发参数</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              <input type="number" id="newBarrelBurstCount" placeholder="连发数" value="3" style="width:60px;" />
              <span style="font-size:12px;color:#888;">发</span>
              <input type="number" id="newBarrelBurstInternalROF" placeholder="内部射速" value="800" style="width:70px;" />
              <span style="font-size:12px;color:#888;">RPM</span>
              <input type="number" id="newBarrelBurstInterval" placeholder="间隔(s)" value="0.1" step="0.01" style="width:70px;" />
              <span style="font-size:12px;color:#888;">s</span>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button id="confirmAddBarrelBtn" class="btn-primary">✅ 确认添加</button>
          <button id="cancelAddBarrelBtn" class="btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 主脚本 ========== -->
  <script src="./bundle.js"></script>
</body>
</html>
